<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Logo de Onda Azul Records: una estrella azul sobre un disco -->

    <!-- Definiciones: el degradado que pinta la estrella (no se dibuja solo) -->
    <defs>
        <!-- Degradado de arriba (celeste) hacia abajo (azul eléctrico) -->
        <linearGradient id="degradado-estrella" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#60A5FA" />
            <stop offset="1" stop-color="#2563EB" />
        </linearGradient>
    </defs>

    <!-- 1. Fondo: círculo azul marino con borde celeste -->
    <circle cx="50" cy="50" r="47" fill="#1E3A8A" stroke="#60A5FA" stroke-width="3" />

    <!-- 2. Surcos de vinilo: dos círculos finitos sin relleno -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.6" />
    <circle cx="50" cy="50" r="33" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.6" />

    <!-- 3. La estrella: un polígono de 10 puntos (5 puntas y 5 huecos).
            translate la baja un poco para que se vea centrada. -->
    <polygon
        points="50,12 59.1,37.5 86.1,38.3 64.7,54.8 72.3,80.7 50,65.5 27.7,80.7 35.3,54.8 13.9,38.3 40.9,37.5"
        transform="translate(0 3)"
        fill="url(#degradado-estrella)"
        stroke="#DBEAFE"
        stroke-width="2.5"
        stroke-linejoin="round" />

    <!-- 4. Centro amarillo, como la etiqueta del medio de un vinilo -->
    <circle cx="50" cy="53" r="5" fill="#FACC15" />
</svg>
